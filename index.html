</div>

    const m=[(p1.x+p2.x)/2,(p1.y+p2.y)/2];
    const mid=[(m[0]-r.left)/r.width*VW,(m[1]-r.top)/r.height*VH];

const EDGE_MIN=2, TRANSFER_MIN=5;
const stationLines={};
Object.keys(LINESTOPS).forEach(id=>{
  LINESTOPS[id].forEach(s=>{(stationLines[s]=stationLines[s]||[]).push(id);});
});
function neighbors(state){
  const [st,ln]=state.split("|");
  const seq=LINESTOPS[ln], i=seq.indexOf(st), out=[];
  const step=j=>{
    if(j<0||j>=seq.length)return;
    out.push({to:seq[j]+"|"+ln,cost:EDGE_MIN,ride:{line:ln,from:st,to:seq[j]}});
  };
  step(i-1); step(i+1);
  if(LINEMETA[ln].loop && seq.length>2){
    if(i===0)out.push({to:seq[seq.length-1]+"|"+ln,cost:EDGE_MIN,ride:{line:ln,from:st,to:seq[seq.length-1]}});
    if(i===seq.length-1)out.push({to:seq[0]+"|"+ln,cost:EDGE_MIN,ride:{line:ln,from:st,to:seq[0]}});
  }
  stationLines[st].forEach(l2=>{
    if(l2!==ln)out.push({to:st+"|"+l2,cost:TRANSFER_MIN,transfer:{line:l2,at:st}});
  });
  return out;
}
function findRoute(from,to){
  const dist={}, prev={}, pq=[];
  stationLines[from].forEach(ln=>{const s=from+"|"+ln;dist[s]=0;pq.push([0,s]);});
  let goal=null;
  while(pq.length){
    pq.sort((a,b)=>a[0]-b[0]);
    const [d,s]=pq.shift();
    if(d>dist[s])continue;
    if(s.split("|")[0]===to){goal=s;break;}
    neighbors(s).forEach(n=>{
      const nd=d+n.cost;
      if(dist[n.to]===undefined||nd<dist[n.to]){
        dist[n.to]=nd; prev[n.to]={from:s,via:n}; pq.push([nd,n.to]);
      }
    });
  }
  if(!goal)return null;
  const steps=[]; let cur=goal;
  while(prev[cur]){steps.unshift(prev[cur].via); cur=prev[cur].from;}
  return {minutes:dist[goal],steps};
}

function stName(id){return NAME[id]+"（"+ST[id].kk.split("|").join("")+"）"+'<span class="hg2">'+ST[id].hg+"</span>";}
function numChip(id,line){
  const e=(ST[id].bd||[]).find(b=>b[0]===line);
  return e?'<span class="no" style="background:'+LINEMETA[line].c+'">'+e[1]+'</span>':"";
}
function stNameN(id,line){return stName(id)+numChip(id,line);}
function stNameAll(id){return stName(id)+(ST[id].bd||[]).map(b=>numChip(id,b[0])).join("");}
function chipsAll(id){return (ST[id].bd||[]).map(b=>numChip(id,b[0])).join("");}
function directionOf(line,fromSt,toSt){
  const seq=LINESTOPS[line], i=seq.indexOf(fromSt), j=seq.indexOf(toSt);
  if(LINEMETA[line].loop){
    const n=seq.length, cw=(j-i+n)%n, ccw=(i-j+n)%n;
    return cw<=ccw?"内回り（時計回り）":"外回り（反時計回り）";
  }
  return (j>i?LINEMETA[line].ends[1]:LINEMETA[line].ends[0])+"方面";
}
function renderRoute(from,to){
  const box=document.getElementById("result");
  const marks=document.getElementById("frontmarks");
  const rp=document.getElementById("routepath");
  marks.innerHTML=""; rp.style.display="none";
  if(from===to){refreshRouteHL([],[]);apply();box.innerHTML='<div class="routeband">ルート</div><div class="empty">出発駅と到着駅が同じです。別の駅を選んでください。</div>';return;}
  const r=findRoute(from,to);
  if(!r){refreshRouteHL([],[]);apply();box.innerHTML='<div class="routeband">ルート</div><div class="empty">ルートが見つかりませんでした。</div>';return;}
  window.dataLayer = window.dataLayer || []; window.dataLayer.push({event: 'route_search', from_station: from, to_station: to});
  const segs=[]; let cur=null, pts=[[ST[from].x,ST[from].y]];
  r.steps.forEach(s=>{
    if(s.ride){
      if(!cur||cur.line!==s.ride.line){cur={line:s.ride.line,from:s.ride.from,to:s.ride.to,stops:1};segs.push(cur);}
      else{cur.to=s.ride.to;cur.stops++;}
      pts.push([ST[s.ride.to].x,ST[s.ride.to].y]);
    }
  });
  const transfers=segs.slice(1).map(s=>s.from);
  refreshRouteHL([from,to].concat(transfers),transfers);
  const totalStops=segs.reduce((a,s)=>a+s.stops,0);
  let html='<div class="routeband">ルート</div><div class="time">約'+r.minutes+'分</div>';
  html+='<div class="meta">'+totalStops+'駅 ・ 乗り換え'+transfers.length+'回</div>';
  html+='<div class="rlegend"><span class="cap">駅の見分け方</span>'
    +'<span class="stmark dep">出発</span>'
    +'<span class="stmark tr">乗り換え</span>'
    +'<span class="stmark arr">到着</span></div>';
  segs.forEach((s,i)=>{
    const m=LINEMETA[s.line];
    const isFirst=i===0;
    if(isFirst){
      html+='<div class="step"><span class="tag dep">出発</span><span class="ln" style="background:'+m.c+'">'+m.name+'</span>'
        +'<br><span class="stmark dep">'+stNameN(s.from,s.line)+'</span>'
        +'<br>'+directionOf(s.line,s.from,s.to)+' ・ '+s.stops+'駅（約'+(s.stops*EDGE_MIN)+'分）</div>';
      return;
    }
    const prev=LINEMETA[segs[i-1].line];
    html+='<div class="step trstep"><span class="tr">乗り換え：</span><b>'+stNameAll(s.from)+'</b><br>'
      +prev.name+' → '+m.name+'（約'+TRANSFER_MIN+'分）'
      +'<br><span class="ln" style="background:'+m.c+'">'+m.name+'</span>'
      +'<br>'+directionOf(s.line,s.from,s.to)+' ・ '+s.stops+'駅（約'+(s.stops*EDGE_MIN)+'分）'
      +'</div>';
  });
  const lastSeg=segs[segs.length-1];
  html+='<div class="step"><span class="tag arr">到着</span>'
    +'<br><span class="stmark arr">'+stNameN(to,lastSeg.line)+'</span></div>';
  if(!transfers.length){
    html+='<div class="tlist">乗り換えなしで到着します。</div>';
  }
  const ai=AREA_INFO[to];
  if(ai){
    html+='<div class="areabox" style="border-left-color:'+ai.c+'">'
      +(AREA_IMG[to]?'<img class="aimg" alt="'+ai.n+'の写真" src="'+AREA_IMG[to]+'" onerror="this.remove()">':"")
      +'<div class="ttl">到着エリア情報</div>'
      +'<div class="an2">'+ai.n+'<span>'+ai.rd+'</span></div>'
      +'<div class="at">'+ai.tag+'</div>'
      +'<ul>'+ai.pts.map(p=>"<li>"+p+"</li>").join("")+'</ul></div>';
  }
  box.innerHTML=html;
  rp.setAttribute("points",pts.map(p=>p.join(",")).join(" "));
  rp.style.display="";
  const mark=(id,color,rr,dashed)=>{
    if(dashed){
      const ring=document.createElementNS(NS,"circle");
      ring.setAttribute("cx",ST[id].x);ring.setAttribute("cy",ST[id].y);ring.setAttribute("r",rr+6);
      ring.setAttribute("fill","none");ring.setAttribute("stroke",color);ring.setAttribute("stroke-width","4");
      ring.setAttribute("stroke-dasharray","7 5");
      marks.appendChild(ring);
    }
    const c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",ST[id].x);c.setAttribute("cy",ST[id].y);c.setAttribute("r",rr);
    c.setAttribute("fill",color);c.setAttribute("stroke","#fff");c.setAttribute("stroke-width","4");
    marks.appendChild(c);
  };
  mark(from,"#1668b4",17); mark(to,"#ff3b30",17);
  /* 乗り換えマーカーは出発マーカー（r=17）の60% = 10.2 */
  transfers.forEach(t=>mark(t,"#ff9500",17*0.6,true));
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const bw=Math.max(maxx-minx,180), bh=Math.max(maxy-miny,180);
  k=Math.min(VW/(bw*1.25),VH/(bh*1.25),3); k=Math.max(k,1);
  tx=VW/2-k*(minx+maxx)/2; ty=VH/2-k*(miny+maxy)/2;
  apply();
}
const fromSel=document.getElementById("from"), toSel=document.getElementById("to");
const sortedIds=Object.keys(ST).sort((a,b)=>ST[a].kk.split("|").join("").localeCompare(ST[b].kk.split("|").join(""),"ja"));

  const label=NAME[id]+"（"+ST[id].kk.split("|").join("")+"）"+ST[id].hg;
  fromSel.add(new Option(label,id)); toSel.add(new Option(label,id));
});

function refreshSelNums(){
  document.getElementById("fromNums").innerHTML='<span class="lbl2">駅番号</span>'+chipsAll(fromSel.value);
  document.getElementById("toNums").innerHTML='<span class="lbl2">駅番号</span>'+chipsAll(toSel.value);
}

/* 駅を探す（駅名検索→ズーム＆ハイライト） */
const searchInput=document.getElementById("stsearch"), candlist=document.getElementById("candlist"),
      searchact=document.getElementById("searchact"), foundname=document.getElementById("foundname");
function hiraToKata(q){return q.replace(/[ぁ-ん]/g,ch=>String.fromCharCode(ch.charCodeAt(0)+0x60));}
let candIds=[];
function focusStation(id){
  searchHL=id;
  refreshRouteHL(lastRouteHL);
  const s=ST[id];
  k=2.4; tx=VW/2-k*s.x; ty=VH/2-k*s.y; apply();
  foundname.innerHTML=stNameAll(id);
  searchact.hidden=false;
  searchInput.value=NAME[id]+"（"+s.kk.split("|").join("")+"）";
  candlist.hidden=true;
}
function clearSearchHL(){
  searchHL=null;
  refreshRouteHL(lastRouteHL);
  apply();
  searchact.hidden=true;
}
function updateCand(){
  const raw=searchInput.value.trim();
  candIds=[];
  if(!raw){candlist.hidden=true;return;}
  const qs=[raw,hiraToKata(raw)];
  candIds=sortedIds.filter(id=>qs.some(q=>NAME[id].includes(q)||ST[id].kk.split("|").join("").includes(q)||ST[id].hg.includes(q))).slice(0,12);
  if(!candIds.length){
    candlist.innerHTML='<div class="none">該当する駅がありません</div>';
  }else{
    candlist.innerHTML=candIds.map((id,i)=>'<button type="button" data-id="'+id+'"'+(i===0?' class="active"':'')+'>'+stNameAll(id)+'</button>').join("");
    candlist.querySelectorAll("button").forEach(b=>b.addEventListener("mousedown",e=>{e.preventDefault();focusStation(b.dataset.id);}));
  }
  candlist.hidden=false;
}
searchInput.addEventListener("input",updateCand);
searchInput.addEventListener("focus",updateCand);
searchInput.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&candIds.length){e.preventDefault();focusStation(candIds[0]);}
  if(e.key==="Escape"){candlist.hidden=true;}
});
document.addEventListener("click",e=>{if(!e.target.closest(".searchwrap"))candlist.hidden=true;});
document.getElementById("setfrom").onclick=()=>{if(!searchHL)return;fromSel.value=searchHL;refreshSelNums();renderRoute(fromSel.value,toSel.value);};
document.getElementById("setto").onclick=()=>{if(!searchHL)return;toSel.value=searchHL;refreshSelNums();renderRoute(fromSel.value,toSel.value);};
document.getElementById("clearhl").onclick=()=>{clearSearchHL();};
renderRoute("incheon","myeongdong");
</script>
